<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .board-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .board-table thead {
            background: #f8f9fa;
        }

        .board-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
            font-size: 14px;
        }

        .board-table td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }

        .board-table tbody tr {
            transition: background-color 0.2s ease;
        }

        .board-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .board-table tbody tr:last-child td {
            border-bottom: none;
        }

        .title-link {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .title-link:hover {
            color: #667eea;
        }

        .author {
            color: #666;
        }

        .date {
            color: #999;
            font-size: 14px;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-data-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
        }

        .pagination button,
        .pagination a {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            color: #666;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .pagination button:hover,
        .pagination a:hover {
            background: #f8f9fa;
            border-color: #667eea;
            color: #667eea;
        }

        .pagination .active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button:disabled:hover {
            background: white;
            border-color: #e0e0e0;
            color: #666;
        }

        .pagination-info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .board-table {
                font-size: 14px;
            }

            .board-table th,
            .board-table td {
                padding: 12px 8px;
            }

            .board-table th:nth-child(3),
            .board-table td:nth-child(3) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>게시판 목록</h1>
            <a th:href="@{/board/register}" class="btn-register">글쓰기</a>
        </div>

        <table class="board-table">
            <thead>
                <tr>
                    <th style="width: 8%;">번호</th>
                    <th style="width: 50%;">제목</th>
                    <th style="width: 15%;">글쓴이</th>
                    <th style="width: 17%;">작성일</th>
                    <th style="width: 10%;">조회수</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(list)}">
                    <td colspan="5" class="no-data">
                        <div class="no-data-icon">📝</div>
                        <div>등록된 게시글이 없습니다.</div>
                    </td>
                </tr>
                <tr th:each="board : ${list}" th:if="${board.useYn == 'Y' or board.useYn == null}">
                    <td th:text="${board.boardNo}"></td>
                    <td>
                        <a th:href="@{/board/read(id=${board.boardNo})}" class="title-link" th:text="${board.boardTitle}"></a>
                    </td>
                    <td class="author" th:text="${board.boardWriter}"></td>
                    <td class="date" th:text="${board.regDate != null ? #temporals.format(board.regDate, 'yyyy-MM-dd') : ''}"></td>
                    <td>0</td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 정보 표시 -->
        <div class="pagination-info" th:if="${totalPages != null and totalPages > 0}">
            전체 <span th:text="${totalElements != null ? totalElements : #lists.size(list)}">0</span>개 중 
            <span th:text="${startRow != null ? startRow : ((currentPage - 1) * pageSize + 1)}">1</span> - 
            <span th:text="${endRow != null ? endRow : (currentPage * pageSize > totalElements ? totalElements : currentPage * pageSize)}">10</span>개 표시
            (페이지 <span th:text="${currentPage != null ? currentPage : 1}">1</span> / <span th:text="${totalPages != null ? totalPages : 1}">1</span>)
        </div>

        <!-- 페이징 네비게이션 -->
        <div class="pagination" th:if="${totalPages != null and totalPages > 1}">
            <!-- 첫 페이지로 이동 -->
            <a th:href="@{/board/list(page=1)}" th:if="${currentPage > 1}">처음</a>
            
            <!-- 이전 페이지 버튼 -->
            <a th:href="@{/board/list(page=${currentPage - 1})}" th:if="${currentPage > 1}">&lt;</a>
            
            <!-- 페이지 번호 (서버에서 startPage, endPage를 전달받음) -->
            <span th:each="pageNum : ${#numbers.sequence(startPage != null ? startPage : 1, endPage != null ? endPage : totalPages)}">
                <a th:href="@{/board/list(page=${pageNum})}" 
                   th:class="${pageNum == currentPage ? 'active' : ''}"
                   th:text="${pageNum}"></a>
            </span>
            
            <!-- 다음 페이지 버튼 -->
            <a th:href="@{/board/list(page=${currentPage + 1})}" th:if="${currentPage < totalPages}">&gt;</a>
            
            <!-- 마지막 페이지로 이동 -->
            <a th:href="@{/board/list(page=${totalPages})}" th:if="${currentPage < totalPages}">마지막</a>
        </div>
    </div>

</body>
</html>
