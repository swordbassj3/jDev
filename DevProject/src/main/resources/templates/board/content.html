<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세보기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .board-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .board-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .board-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-label {
            font-weight: 600;
            color: #999;
        }

        .meta-value {
            color: #666;
        }

        .board-content {
            min-height: 300px;
            padding: 30px 0;
            color: #444;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .board-footer {
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button,
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-list {
            background: #f5f5f5;
            color: #666;
        }

        .btn-list:hover {
            background: #e0e0e0;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-data-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .board-title {
                font-size: 22px;
            }

            .board-meta {
                flex-direction: column;
                gap: 10px;
            }

            .board-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-group {
                width: 100%;
            }

            button,
            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 게시글이 없는 경우 -->
        <div th:if="${board == null}" class="no-data">
            <div class="no-data-icon">📝</div>
            <div>게시글을 찾을 수 없습니다.</div>
            <a th:href="@{/board/list}" class="btn btn-list" style="margin-top: 20px;">목록으로</a>
        </div>

        <!-- 게시글 상세 정보 -->
        <div th:if="${board != null}">
            <div class="board-header">
                <h1 class="board-title" th:text="${board.boardTitle}">게시글 제목</h1>
                <div class="board-meta">
                    <div class="meta-item">
                        <span class="meta-label">글쓴이:</span>
                        <span class="meta-value" th:text="${board.boardWriter}">작성자</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">작성일:</span>
                        <span class="meta-value" th:text="${board.regDate != null ? #temporals.format(board.regDate, 'yyyy-MM-dd HH:mm:ss') : ''}">2024-01-15 14:30:25</span>
                    </div>
                    <div class="meta-item" th:if="${board.modDate != null}">
                        <span class="meta-label">수정일:</span>
                        <span class="meta-value" th:text="${#temporals.format(board.modDate, 'yyyy-MM-dd HH:mm:ss')}">2024-01-15 15:30:25</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">번호:</span>
                        <span class="meta-value" th:text="${board.boardNo}">1</span>
                    </div>
                </div>
            </div>

            <div class="board-content" th:text="${board.boardContent}">
                게시글 내용이 여기에 표시됩니다.
            </div>

            <div class="board-footer">
                <a th:href="@{/board/list}" class="btn btn-list">목록으로</a>
                <div class="btn-group">
                    <a th:href="@{/board/update(boardNo=${board.boardNo})}" class="btn btn-edit">수정</a>
                    <button class="btn btn-delete" th:onclick="'handleDelete(' + ${board.boardNo} + ')'">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function handleDelete(boardNo) {
            if (confirm('정말 삭제하시겠습니까?')) {
                // 폼을 생성하여 DELETE 요청 전송
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = /*[[@{/board/delete}]]*/ '/board/delete';
                
                const boardNoInput = document.createElement('input');
                boardNoInput.type = 'hidden';
                boardNoInput.name = 'boardNo';
                boardNoInput.value = boardNo;
                
                const methodInput = document.createElement('input');
                methodInput.type = 'hidden';
                methodInput.name = '_method';
                methodInput.value = 'DELETE';
                
                form.appendChild(boardNoInput);
                form.appendChild(methodInput);
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
