<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세보기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .board-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .board-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .board-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-label {
            font-weight: 600;
            color: #999;
        }

        .meta-value {
            color: #666;
        }

        .board-content {
            min-height: 300px;
            padding: 30px 0;
            color: #444;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .board-footer {
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button,
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-list {
            background: #f5f5f5;
            color: #666;
        }

        .btn-list:hover {
            background: #e0e0e0;
        }

        .btn-edit {
            background: #3498db;
            color: white;
        }

        .btn-edit:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .board-title {
                font-size: 22px;
            }

            .board-meta {
                flex-direction: column;
                gap: 10px;
            }

            .board-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-group {
                width: 100%;
            }

            button,
            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-header">
            <h1 class="board-title" id="boardTitle">게시판 첫 번째 글입니다</h1>
            <div class="board-meta">
                <div class="meta-item">
                    <span class="meta-label">글쓴이:</span>
                    <span class="meta-value" id="boardAuthor">홍길동</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">작성일:</span>
                    <span class="meta-value" id="boardDate">2024-01-15 14:30:25</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">조회수:</span>
                    <span class="meta-value" id="boardViews">12</span>
                </div>
            </div>
        </div>

        <div class="board-content" id="boardContent">
게시글 내용이 여기에 표시됩니다.

이것은 샘플 게시글 내용입니다. 실제 구현 시에는 서버에서 가져온 데이터가 여기에 표시됩니다.

여러 줄의 내용도 정상적으로 표시되며, 줄바꿈과 공백이 그대로 유지됩니다.

게시판 기능을 테스트하기 위한 샘플 데이터입니다.
        </div>

        <div class="board-footer">
            <a href="list.html" class="btn btn-list">목록으로</a>
            <div class="btn-group">
                <button class="btn btn-edit" onclick="handleEdit()">수정</button>
                <button class="btn btn-delete" onclick="handleDelete()">삭제</button>
            </div>
        </div>
    </div>

    <script>
        // URL에서 게시글 ID 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('id');

        // 실제 구현 시 여기에 서버에서 데이터를 가져오는 로직 추가

        //     fetch(`/api/board/${boardId}`)
        //         .then(response => response.json())
        //         .then(data => {
        //             document.getElementById('boardTitle').textContent = data.title;
        //             document.getElementById('boardAuthor').textContent = data.author;
        //             document.getElementById('boardDate').textContent = data.createdDate;
        //             document.getElementById('boardViews').textContent = data.views;
        //             document.getElementById('boardContent').textContent = data.content;
        //         });
        // }

        function handleEdit() {
            if (boardId) {
                // 실제 구현 시: window.location.href = `edit.html?id=${boardId}`;
                alert('수정 기능은 구현 예정입니다.');
            }
        }

        function handleDelete() {
            if (confirm('정말 삭제하시겠습니까?')) {
                // 실제 구현 시:

                //         window.location.href = 'list.html';
                //     });
                alert('삭제 기능은 구현 예정입니다.');
            }
        }
    </script>
</body>
</html>
